name: TODO Native PostgreSQL Validation

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: todo-native-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  native-postgres:
    name: TODO PostgreSQL without Notion
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      TODO_NATIVE_E2E_DISPOSABLE: "1"
      # Synthetic credential for this disposable CI service only; no repository secret.
      TODO_NATIVE_E2E_DSN: postgresql://todo_ci:ci_fixture_only@127.0.0.1:5432/todo_native_ci
    steps:
      - name: Checkout exact validator revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: harness
          persist-credentials: false
      - name: Checkout immutable existing gateway
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ericson-j-santos/chatgpt-operational-rules
          ref: 28fc1eb58b6c8163e8c4fa63a6bb0adbd1376f59
          path: subject
          persist-credentials: false
      - name: Configure Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Validate target guards and negative controls
        run: python harness/tests/test_todo_native_probe.py
      - name: Install existing gateway requirements
        run: python -m pip install --disable-pip-version-check -r subject/services/todo_gateway/requirements.txt
      - name: Start isolated native PostgreSQL without Docker
        run: python harness/scripts/native_postgres_service.py start
      - name: Exercise real HTTP and PostgreSQL without Notion
        run: python harness/scripts/todo_native_postgres_probe.py --source subject --report evidence/todo-native.json --phase exercise
      - name: Restart only the disposable PostgreSQL service
        run: python harness/scripts/native_postgres_service.py restart
      - name: Independently verify persistence after database restart
        run: python harness/scripts/todo_native_postgres_probe.py --source subject --report evidence/todo-native.json --phase readback
      - name: Preserve evidence tied to source and validator SHA
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: todo-native-postgres-${{ github.run_id }}
          path: evidence/todo-native.json
          if-no-files-found: error
          retention-days: 7
      - name: Stop only this disposable native PostgreSQL cluster
        if: always()
        run: python harness/scripts/native_postgres_service.py stop
