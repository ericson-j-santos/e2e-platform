name: E2E Platform CI

on:
  pull_request:
  push:
    branches: [main, 'fix/e2e-gate-integrity-*']

permissions:
  contents: read

jobs:
  contract-self-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Unit and real CLI regression tests
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Validate positive fixture
        run: python scripts/validate_evidence.py tests/fixtures/valid-evidence.json
      - name: Validate schema JSON syntax
        run: python -m json.tool schemas/evidence.schema.json > /dev/null
